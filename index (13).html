<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auto-Responsive Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1>Landscape Gallery</h1>
    <p>Resize the window: the columns adjust automatically.</p>
  </header>

  <main class="gallery">

    <figure class="gallery-item">
      <img src="images/sunrise.jpg" alt="Sunrise over hills">
    </figure>

    <figure class="gallery-item">
      <img src="images/alpine.jpg" alt="Alpine ridge">
    </figure>

    <figure class="gallery-item">
      <img src="images/meadow.jpg" alt="Green meadow">
    </figure>

    <figure class="gallery-item">
      <img src="images/dusk.jpg" alt="Dusk valley">
    </figure>

    <figure class="gallery-item">
      <img src="images/desert.jpg" alt="Desert dunes">
    </figure>

    <figure class="gallery-item">
      <img src="images/lake.jpg" alt="Quiet lake">
    </figure>

    <figure class="gallery-item">
      <img src="images/forest.jpg" alt="Forest slopes">
    </figure>

    <figure class="gallery-item">
      <img src="images/coast.jpg" alt="Sunny coast">
    </figure>

    <figure class="gallery-item">
      <img src="images/night.jpg" alt="Starry night">
    </figure>

    <figure class="gallery-item">
      <img src="images/autumn.jpg" alt="Autumn hills">
    </figure>
  </main>
</body>
</html>
